<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--panel2:#24364d;--text:#f4f6fb;--muted:#b8c5d6;--gold:#f3c969;--line:#3b4b60}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:19px;line-height:1.5}
header{padding:25px 16px 18px;text-align:center;background:#172438;border-bottom:1px solid var(--line)}h1{font-size:clamp(25px,6vw,34px);line-height:1.2;margin:0 0 8px;color:var(--gold)}header p{margin:0;color:var(--muted);font-size:16px}

.items{display:grid;grid-template-columns:1fr;gap:11px}.item{display:block;width:100%;padding:17px 16px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);font-size:20px;font-weight:700;text-align:left;text-decoration:none;cursor:pointer}.item:active{background:var(--panel2)}.item small{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-top:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.action{display:inline-block;padding:13px 16px;border:1px solid var(--gold);border-radius:12px;background:#3a321f;color:#ffe6a0;text-decoration:none;font-weight:700;font-size:17px}.chapterGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.chapter{display:block;text-align:center;padding:13px 5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:19px;font-weight:700;text-decoration:none}.chapter:active{background:var(--panel2)}
footer{text-align:center;color:#8fa0b5;font-size:13px;padding:12px 16px 28px}
@media(min-width:600px){.items{grid-template-columns:1fr 1fr}.chapterGrid{grid-template-columns:repeat(6,minmax(0,1fr))}main{padding-top:25px}}
</style>

const content=document.getElementById('content'), title=document.getElementById('viewTitle'), intro=document.getElementById('intro'), crumb=document.getElementById('crumb');
let versionName='', testamentName='', currentBook=null, historyStack=[];
function button(label,detail,fn){const b=document.createElement('button');b.className='item';b.type='button';b.textContent=label;if(detail){const s=document.createElement('small');s.textContent=detail;b.appendChild(s)}b.addEventListener('click',fn);return b}
function reset(t,i){title.textContent=t;intro.textContent=i||'';content.className='items';content.replaceChildren()}
function setCrumb(parts){crumb.replaceChildren();parts.forEach((p,i)=>{if(i)crumb.append('  ›  ');if(p.fn){const b=document.createElement('button');b.textContent=p.label;b.onclick=p.fn;crumb.appendChild(b)}else crumb.append(p.label)})}
function home(){versionName='';testamentName='';currentBook=null;setCrumb([]);reset('','');Object.keys(BIBLE_DATA).forEach(v=>content.appendChild(button(v,'',()=>showTestaments(v))))}
function showTestaments(v){versionName=v;testamentName='';currentBook=null;setCrumb([{label:'Trang đầu',fn:home}, {label:v}]);reset(v,'');['Cựu Ước','Tân Ước'].forEach(t=>{const n=BIBLE_DATA[v].filter(b=>b.testament===t).length;content.appendChild(button(t,n+' sách',()=>showBooks(t)))})}
function showBooks(t){testamentName=t;currentBook=null;setCrumb([{label:'Trang đầu',fn:home},{label:versionName,fn:()=>showTestaments(versionName)},{label:t}]);reset(t+' — '+versionName,'Chọn một sách.');BIBLE_DATA[versionName].filter(b=>b.testament===t).forEach(book=>content.appendChild(button(book.name,book.chapters.length+' chương',()=>showChapters(book))))}
function showChapters(book){currentBook=book;setCrumb([{label:'Trang đầu',fn:home},{label:versionName,fn:()=>showTestaments(versionName)},{label:testamentName,fn:()=>showBooks(testamentName)},{label:book.name}]);reset(book.name,'Chọn một chương hoặc mở toàn bộ sách.');const actions=document.createElement('div');actions.className='actions';const playlist=document.createElement('a');playlist.className='action';playlist.href=book.playlist;playlist.target='_blank';playlist.rel='noopener noreferrer';playlist.textContent='▶ MỞ TOÀN BỘ SÁCH';actions.appendChild(playlist);content.appendChild(actions);const grid=document.createElement('div');grid.className='chapterGrid';book.chapters.forEach(ch=>{const a=document.createElement('a');a.className='chapter';a.href=ch.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=ch.label;grid.appendChild(a)});content.appendChild(grid);content.className='';}
